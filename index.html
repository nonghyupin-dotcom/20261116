<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회의실 예약 현황판 | 서부발전 교육 실습</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap" style="margin:0 auto;padding:0"><p class="eyebrow">KOWEPO · VIBE CODING STUDY</p><h1>회의실 예약 현황판</h1><p>반복되는 업무를 작은 웹서비스로 · 교육용 가상 데이터</p></div></header><main class="wrap"><div class="stats"><div class="stat">활성 예약<strong id="s-all">0</strong></div><div class="stat">예약된 회의실 수<strong id="s-room">0</strong></div><div class="stat">취소 기록<strong id="s-cancel">0</strong></div></div><section class="panel"><h2>새 예약 등록</h2><form id="form" class="fields"><div class="field"><label for="room">회의실</label><select id="room"><option>회의실 A</option><option>회의실 B</option><option>회의실 C</option></select></div><div class="field"><label for="date">예약 날짜</label><input required id="date" type="date" value="2026-11-12"></div><div class="field"><label for="start">시작 시간</label><input required id="start" type="time" value="10:00"></div><div class="field"><label for="end">종료 시간</label><input required id="end" type="time" value="11:00"></div><div class="field"><label for="name">예약자</label><input required id="name" placeholder="예: 홍가상"></div><button type="submit">예약 등록</button></form><div class="msg" id="message"></div></section><section class="panel"><div class="actions"><h2>예약 목록</h2><div class="filters"><select id="filter-room"><option>전체</option><option>회의실 A</option><option>회의실 B</option><option>회의실 C</option></select><button class="secondary" id="copy">보고용 요약 복사</button><button class="secondary" id="reset">샘플 초기화</button></div></div><table><thead><tr><th>회의실</th><th>예약일</th><th>시간</th><th>예약자</th><th>상태</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table><p class="note">실습 안내: 개인정보·실제 업무자료는 입력하지 마세요. 데이터는 현재 브라우저(localStorage)에 저장되며 다른 PC와 공유되지 않습니다.</p></section></main><script src="logic.js"></script><script src="app.js"></script><div class="deployment-info" style="position:fixed;right:12px;bottom:12px;background:#123447;color:#fff;border-radius:24px;padding:9px 14px;font:700 12px sans-serif;box-shadow:0 4px 12px #12344733;z-index:99">교육용 배포 연습 · v1</div></body></html>
